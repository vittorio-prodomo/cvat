metadata:
  name: pth-facebookresearch-sam3-interactor
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    extra_params_schema: |
      [
        {
          "name": "text_prompt",
          "type": "text",
          "label": "Text prompt",
          "description": "A short description of the objects to find",
          "default": "",
          "max_length": 256,
          "supports_mask_refinement": true,
          "supports_concept_box": true
        }
      ]
    help_message: Use Single object for points and an optional starting box. Use Find similar objects with text, one positive exemplar box, or both; then select a returned mask for point refinement.

spec:
  description: Interactive object segmentation with Segment Anything 3
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3
    - name: SAM3_CHECKPOINT_PATH
      value: /opt/nuclio/models/sam3/sam3.pt

  build:
    image: cvat.pth.facebookresearch.sam3.interactor:latest-gpu
    baseImage: nvidia/cuda:12.8.0-cudnn-runtime-ubuntu24.04@sha256:c40d1065da90274969f9faa7fe1a7fcd1c374d5783482eec09ee5b516746088f

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: ENV
          value: PIP_BREAK_SYSTEM_PACKAGES=1
        - kind: WORKDIR
          value: /opt/nuclio/sam3
        - kind: RUN
          value: >-
            apt-get update --snapshot 20260901T000000Z &&
            apt-get -y install --snapshot 20260901T000000Z --no-install-recommends
            git python3 python3-pip python3-dev python-is-python3
            gcc libc6-dev ffmpeg libsm6 libxext6 &&
            rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: >-
            python -m pip install --no-cache-dir --ignore-installed
            pip==26.2.1 setuptools==80.10.2 wheel==0.48.0 packaging==26.3

      postCopy:
        - kind: RUN
          value: >-
            python -m pip install --no-cache-dir
            --constraint /opt/nuclio/sam3-runtime-constraints.txt
            torch==2.10.0+cu128 torchvision==0.25.0+cu128
            --index-url https://download.pytorch.org/whl/cu128
        - kind: RUN
          value: >-
            python -m pip install --no-cache-dir
            --constraint /opt/nuclio/sam3-runtime-constraints.txt
            --build-constraint /opt/nuclio/sam3-runtime-constraints.txt
            numpy==1.26.4 timm==1.0.29 tqdm==4.70.0 ftfy==6.1.1
            regex==2026.9.3 iopath==0.1.10 typing-extensions==4.16.0
            pillow==12.3.0 einops==0.8.2 pycocotools==2.0.11
            psutil==7.2.2 huggingface-hub==1.29.0
            git+https://github.com/facebookresearch/sam3.git@660a5e9e1b8b4c02c0ad97229b88a09a6e4ff5b7

  volumes:
    - volume:
        name: sam3-checkpoint
        hostPath:
          path: "/data/cvat/data/models/sam3"
      volumeMount:
        name: sam3-checkpoint
        mountPath: "/opt/nuclio/models/sam3"
        readOnly: true

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
