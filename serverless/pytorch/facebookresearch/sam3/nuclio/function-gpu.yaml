metadata:
  name: pth-facebookresearch-sam3-interactor
  namespace: cvat
  annotations:
    name: Segment Anything 3
    version: 2
    type: interactor
    spec:
    min_pos_points: 0
    min_neg_points: 0
    startswith_box_optional: true
    help_message: The interactor allows prompt-based segmentation with Segment Anything 3 using positive and negative points and an optional bounding box.

spec:
  description: Interactive object segmentation with Segment Anything 3
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio/sam3

  build:
    image: cvat.pth.facebookresearch.sam3.interactor:latest-gpu
    baseImage: nvidia/cuda:12.8.0-cudnn-runtime-ubuntu22.04

    directives:
      preCopy:
        - kind: ENV
          value: NVIDIA_VISIBLE_DEVICES=all
        - kind: ENV
          value: NVIDIA_DRIVER_CAPABILITIES=compute,utility
        - kind: ENV
          value: DEBIAN_FRONTEND=noninteractive
        - kind: WORKDIR
          value: /opt/nuclio/sam3
        - kind: RUN
          value: apt-get update && apt-get -y install git python3 python3-pip python-is-python3 ffmpeg libsm6 libxext6 && rm -rf /var/lib/apt/lists/*
        - kind: RUN
          value: python -m pip install --upgrade pip setuptools wheel
        - kind: RUN
          value: python -m pip install --no-cache-dir torch==2.10.0 torchvision --index-url https://download.pytorch.org/whl/cu128
        - kind: RUN
          value: python -m pip install --no-cache-dir pillow git+https://github.com/facebookresearch/sam3.git einops pycocotools psutil

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
