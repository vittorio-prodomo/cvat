spec:
  description: Eleven-class indoor instance segmentation on a frame or CVAT region of interest
  runtime: python:3.11
  handler: main:handler
  image: cvat.rfdetr.indoor.v3:confidence-text-20260904
  eventTimeout: 60s
  readinessTimeoutSeconds: 300
  env:
    - name: CHECKPOINT_PATH
      value: /opt/models/epoch=016-map=0.0749.ckpt
  volumes:
    - volume:
        name: indoor-checkpoint
        hostPath:
          path: /data/cvat/data/models/indoor-v3
      volumeMount:
        name: indoor-checkpoint
        mountPath: /opt/models
        readOnly: true
  triggers:
    myHttpTrigger:
      kind: http
      numWorkers: 1
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432
  resources:
    limits:
      nvidia.com/gpu: 1
  platform:
    attributes:
      network: cvat_cvat
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
