metadata:
  name: pth-ultralytics-yolov11l-bridgy
  namespace: cvat
  annotations:
    name: Bridgy (YOLOv11x)
    type: detector
    framework: pytorch
    spec: |
      [
        { "id": 0, "name": "exposed_rebar"},
        { "id": 1, "name": "mechanical_spall"},
        { "id": 2, "name": "spall"},
        { "id": 3, "name": "splitting_crack"},
        { "id": 4, "name": "surface_defect"},
        { "id": 5, "name": "mild_crack"}
      ]

spec:
  description: YOLOv11 Bridgy from AlgoritmIA (Beta) for GPU
  runtime: 'python:3.10'
  handler: main:handler
  eventTimeout: 30s

  build:
    image: algoritmIA/yolo-bridgy
    baseImage: ultralytics/ultralytics:latest
    directives:
      preCopy:
        - kind: WORKDIR
          value: /opt/nuclio
        - kind: RUN
          value: apt update && apt install --no-install-recommends -y curl libglib2.0-0
      postCopy:
        - kind: RUN
          value: curl -O https://the-commander.net/s/2ci746Zf3iQsPTK/download/new_best.pt
        - kind: RUN
          value: pip install sahi scikit-image supervision

    # volumes:
    #   - type: bind
    #     source: /home/unina/cvat/serverless/pytorch/unina/bridge_defect_detector/yolov11x_v0.1/
    #     target: /opt/nuclio/model

  volumes:
    # Mount a host directory (read-only) into /models
    - volume:
        name: data-mount
        hostPath:
          path: "/data/projects/bridge_defect_detection"   # e.g., /home/pier/models
      volumeMount:
        name: data-mount
        mountPath: "/data"
        readOnly: true

  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: 'http'
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 33554432 # 32MB

  resources:
    limits:
      nvidia.com/gpu: 1

  platform:
    attributes:
      restartPolicy:
      #   name: always
      #   maximumRetryCount: 3
      # mountMode: volume
